<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  /* 对切开场：左栏是一块色面，右栏才开始读。标题左齐，要点横排成行。
     色面用强调色，不是图片。无外链、无脚本。 */
  :root {
    --bg: {{BG}};
    --surface: {{SURFACE}};
    --ink: {{INK}};
    --muted: {{MUTED}};
    --accent: {{ACCENT}};
    --accent-ink: {{ACCENT_INK}};
    --rule: {{RULE}};
    --radius: {{RADIUS}};
    --font-head: {{FONT_HEAD}};
    --font-body: {{FONT_BODY}};
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
  }
  .split {
    display: grid;
    grid-template-columns: 92px minmax(0, 1fr);
    height: 100%;
    background: var(--surface);
  }
  .rail {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 14px;
    background: var(--accent);
    color: var(--accent-ink);
  }
  .mark {
    width: 100%;
    height: 72px;
    border: 2px solid currentColor;
    border-radius: var(--radius);
  }
  .copy {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
    padding: 22px 16px 16px;
  }
  .copy > header { display: flex; flex-direction: column; gap: 8px; }
  .shop {
    margin: 0;
    font-family: var(--font-head);
    font-size: 28px;
    font-weight: 650;
    line-height: 1.15;
    text-align: left;
  }
  .tagline { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; text-align: left; }
  .list { margin: 0; padding: 0; list-style: none; }
  .item {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr) auto;
    gap: 8px;
    align-items: baseline;
    padding: 7px 0;
    border-top: 1px solid var(--rule);
  }
  .item:last-child { border-bottom: 1px solid var(--rule); }
  .num { color: var(--accent); font-size: 11px; font-variant-numeric: tabular-nums; }
  .book { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .cta {
    appearance: none;
    width: 100%;
    min-height: 44px;
    margin-top: auto;
    border: 0;
    border-radius: var(--radius);
    background: var(--ink);
    color: var(--bg);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
  }
  .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .foot { margin: 0; color: var(--muted); font-size: 10px; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
</style>
</head>
<body data-archetype="hero-split">
  <div class="split">
    <aside class="rail"><div class="mark"></div></aside>
    <main class="copy">
      <header>
        <h1 class="shop">{{TITLE}}</h1>
        <p class="tagline">{{SUBTITLE}}</p>
      </header>
      <ul class="list">
        <li class="item"><span class="num">01</span><span class="book">{{BULLET_1}}</span><span class="meta">{{BULLET_1_META}}</span></li>
        <li class="item"><span class="num">02</span><span class="book">{{BULLET_2}}</span><span class="meta">{{BULLET_2_META}}</span></li>
        <li class="item"><span class="num">03</span><span class="book">{{BULLET_3}}</span><span class="meta">{{BULLET_3_META}}</span></li>
      </ul>
      <button class="cta" type="button">{{CTA}}</button>
      <p class="foot">{{FOOT}}</p>
    </main>
  </div>
</body>
</html>
